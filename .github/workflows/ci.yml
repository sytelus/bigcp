name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        shell: pwsh
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy --target x86_64-pc-windows-msvc
      - name: Create isolated C drive test root
        shell: pwsh
        run: |
          # The testkit sandbox validator requires at least three normal path
          # components below the drive root, so the per-run temp is nested.
          $root = "C:\bigcp-ci\run-${{ github.run_id }}-${{ github.run_attempt }}\temp"
          New-Item -ItemType Directory -Path $root -Force -ErrorAction Stop | Out-Null
          "TEMP=$root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TMP=$root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Verify frozen inputs and test safety
        shell: pwsh
        run: |
          ./scripts/check-frozen-inputs.ps1
          ./scripts/check-test-safety.ps1
      - name: Format
        shell: cmd
        run: scripts\cargo-msvc.cmd fmt --all -- --check
      - name: Clippy
        shell: cmd
        run: scripts\cargo-msvc.cmd clippy --workspace --all-targets --locked -- -D warnings
      - name: Install pinned supply-chain tools
        shell: cmd
        run: |
          cargo install cargo-deny --version 0.20.2 --locked
          cargo install cargo-audit --version 0.22.2 --locked
      - name: Dependency policy and vulnerability audit
        shell: cmd
        run: |
          scripts\cargo-msvc.cmd deny check
          scripts\cargo-msvc.cmd audit
      - name: Tests
        shell: cmd
        run: scripts\cargo-msvc.cmd test --workspace --all-targets --locked -- --test-threads=1
      - name: Documentation
        shell: cmd
        run: scripts\cargo-msvc.cmd doc --workspace --no-deps --locked
      - name: Release build
        shell: cmd
        run: scripts\cargo-msvc.cmd build --workspace --release --locked
